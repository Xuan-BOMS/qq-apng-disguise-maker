<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>双面 PNG 制作器</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f1f4f3; color: #202b2c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 1120px; margin: 0 auto; padding: 34px 28px 64px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 26px; border-bottom: 1px solid #cbd3d0; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .mark { position: relative; width: 38px; height: 38px; flex: none; }
    .mark::before, .mark::after { content: ""; position: absolute; width: 23px; height: 28px; border: 2px solid #202b2c; background: #f1f4f3; }
    .mark::before { left: 2px; top: 2px; transform: rotate(-9deg); }
    .mark::after { left: 11px; top: 7px; border-color: #d95743; transform: rotate(8deg); }
    h1 { margin: 0; font-size: 28px; font-weight: 750; line-height: 1.2; }
    .header-note { margin: 0 0 2px; color: #697779; font-size: 13px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 27px; }
    .panel { min-width: 0; background: #fff; border: 1px solid #d5ddda; border-radius: 7px; overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; padding: 0 19px; border-bottom: 1px solid #e0e6e3; }
    .panel-title { display: flex; align-items: baseline; gap: 11px; min-width: 0; }
    .number { color: #d95743; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
    h2 { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; }
    .select { flex: none; color: #0a7568; border: 0; background: none; padding: 8px 0 8px 10px; font-size: 13px; font-weight: 700; }
    .select:hover, .select:focus-visible { text-decoration: underline; }
    .drop { position: relative; display: grid; place-items: center; height: 340px; margin: 14px; border: 1px dashed #c5cfcb; border-radius: 4px; background: #f7f9f8; overflow: hidden; cursor: pointer; transition: border-color .15s, background .15s; }
    .drop:hover, .drop.dragging, .drop:focus-visible { border-color: #0a897a; background: #eff8f5; outline: none; }
    .drop img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; }
    .drop .empty { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: #536365; pointer-events: none; }
    .empty strong { color: #263233; font-size: 15px; }
    .empty span { font-size: 12px; }
    .empty-glyph { position: relative; width: 42px; height: 42px; margin-bottom: 7px; border: 1.5px solid #82918c; border-radius: 3px; }
    .empty-glyph::before { content: ""; position: absolute; left: 8px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: #82918c; }
    .empty-glyph::after { content: ""; position: absolute; left: 9px; bottom: 8px; width: 22px; height: 15px; border-left: 1.5px solid #82918c; border-bottom: 1.5px solid #82918c; transform: skew(-25deg); }
    .panel-meta { display: flex; justify-content: space-between; gap: 12px; min-height: 42px; padding: 0 17px 12px; color: #61716e; font-size: 12px; }
    .filename { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dimensions { flex: none; font-variant-numeric: tabular-nums; }
    .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 32px; padding: 27px 0 25px; border-bottom: 1px solid #cbd3d0; }
    .setting { display: flex; align-items: center; gap: 12px; }
    .setting-label { color: #566663; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .segmented { display: inline-flex; padding: 3px; border: 1px solid #cbd5d1; border-radius: 5px; background: #e8eeeb; }
    .segmented button { min-width: 88px; padding: 8px 11px; border: 0; border-radius: 3px; background: transparent; color: #586965; font-size: 13px; }
    .segmented button[aria-pressed="true"] { color: #19312f; background: white; box-shadow: 0 1px 4px #24383020; font-weight: 700; }
    .color-input { width: 35px; height: 35px; padding: 3px; border: 1px solid #bfcac5; border-radius: 4px; background: white; cursor: pointer; }
    .color-value { color: #667571; font-size: 12px; font-variant-numeric: tabular-nums; }
    .output { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-top: 24px; }
    .output-info { min-width: 0; }
    .output-info strong { display: block; margin-bottom: 4px; font-size: 15px; }
    .output-info span { display: block; color: #6b7976; font-size: 12px; line-height: 1.6; }
    .action { flex: none; min-width: 184px; min-height: 46px; padding: 11px 18px; border: 1px solid #1d2929; border-radius: 4px; background: #1d2929; color: white; font-size: 14px; font-weight: 700; transition: background .15s, transform .15s; }
    .action:hover:not(:disabled) { background: #0a7568; border-color: #0a7568; transform: translateY(-1px); }
    .action:disabled { cursor: not-allowed; opacity: .45; }
    .status { margin-top: 15px; min-height: 21px; color: #0a7568; font-size: 13px; }
    .status.error { color: #c24335; }
    .section { margin-top: 34px; padding-top: 25px; border-top: 1px solid #cbd3d0; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .section-head h2 { font-size: 20px; }
    .section-head p { margin: 5px 0 0; color: #697779; font-size: 13px; }
    .secondary { padding: 10px 14px; border: 1px solid #aab9b4; border-radius: 4px; background: #fff; color: #1c3734; font-size: 13px; font-weight: 700; }
    .secondary:hover:not(:disabled) { border-color: #0a7568; color: #0a7568; }
    .secondary:disabled { opacity: .45; cursor: not-allowed; }
    .preview-box { position: relative; width: min(100%, 460px); height: 320px; border: 1px solid #d5ddda; border-radius: 5px; background: #fff; overflow: hidden; }
    .preview-box img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; }
    .extract-drop { display: flex; align-items: center; justify-content: center; min-height: 112px; padding: 18px; border: 1px dashed #b7c6c0; border-radius: 5px; background: #f7f9f8; color: #536365; text-align: center; cursor: pointer; }
    .extract-drop:hover, .extract-drop.dragging, .extract-drop:focus-visible { border-color: #0a897a; background: #eff8f5; outline: none; }
    .extract-drop strong { display: block; color: #263233; font-size: 14px; }
    .extract-drop span { display: block; margin-top: 6px; font-size: 12px; }
    .frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 14px; margin-top: 18px; }
    .frame { min-width: 0; padding: 12px; border: 1px solid #d5ddda; border-radius: 5px; background: #fff; }
    .frame img { display: block; width: 100%; height: 190px; object-fit: contain; background: #f7f9f8; }
    .frame-title { display: flex; justify-content: space-between; gap: 8px; margin: 11px 0; font-size: 13px; }
    .frame-title span { color: #697779; }
    .frame .secondary { width: 100%; }
    [hidden] { display: none !important; }
    input[type="file"] { display: none; }
    @media (max-width: 700px) {
      .app { padding: 20px 16px 36px; }
      header { align-items: flex-start; }
      h1 { font-size: 23px; }
      .header-note { display: none; }
      .workspace { grid-template-columns: 1fr; gap: 12px; margin-top: 18px; }
      .drop { height: min(56vw, 310px); min-height: 210px; }
      .settings { gap: 16px; padding: 20px 0; }
      .output { align-items: stretch; flex-direction: column; gap: 15px; }
      .action { width: 100%; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .preview-box { height: 240px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><span class="mark" aria-hidden="true"></span><h1>双面 PNG 制作器</h1></div>
      <p class="header-note">本地处理 · APNG</p>
    </header>

    <div class="workspace">
      <section class="panel" aria-labelledby="cover-title">
        <div class="panel-head"><div class="panel-title"><span class="number">01</span><h2 id="cover-title">静态封面</h2></div><button class="select" type="button" data-pick="cover">选择图片</button></div>
        <div class="drop" id="cover-drop" role="button" tabindex="0" aria-label="选择静态封面图片">
          <div class="empty"><i class="empty-glyph" aria-hidden="true"></i><strong>选择或拖入图片</strong><span>普通预览中显示</span></div>
        </div>
        <div class="panel-meta"><span class="filename" id="cover-name">尚未选择</span><span class="dimensions" id="cover-size"></span></div>
      </section>
      <section class="panel" aria-labelledby="reveal-title">
        <div class="panel-head"><div class="panel-title"><span class="number">02</span><h2 id="reveal-title">打开后画面</h2></div><button class="select" type="button" data-pick="reveal">选择图片</button></div>
        <div class="drop" id="reveal-drop" role="button" tabindex="0" aria-label="选择打开后显示的图片">
          <div class="empty"><i class="empty-glyph" aria-hidden="true"></i><strong>选择或拖入图片</strong><span>APNG 查看器中显示</span></div>
        </div>
        <div class="panel-meta"><span class="filename" id="reveal-name">尚未选择</span><span class="dimensions" id="reveal-size"></span></div>
      </section>
    </div>

    <div class="settings">
      <div class="setting"><span class="setting-label">画面适配</span><div class="segmented" role="group" aria-label="打开后画面适配"><button type="button" data-fit="contain" aria-pressed="true">完整显示</button><button type="button" data-fit="cover" aria-pressed="false">填满裁切</button></div></div>
      <div class="setting"><label class="setting-label" for="background">留白颜色</label><input class="color-input" id="background" type="color" value="#ffffff"><span class="color-value" id="color-value">#FFFFFF</span></div>
    </div>

    <div class="output">
      <div class="output-info"><strong id="output-size">等待选择图片</strong><span id="output-note">输出尺寸采用静态封面的尺寸</span></div>
      <button class="action" id="generate" type="button" disabled>生成 PNG</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <section class="section" id="result" hidden aria-labelledby="result-title">
      <div class="section-head"><div><h2 id="result-title">成品预览</h2><p>这里显示未点开原图时看到的默认画面。</p></div><button class="secondary" id="download-result" type="button">下载完整 PNG</button></div>
      <div class="preview-box"><img id="result-cover" alt="成品默认显示画面"></div>
    </section>
    <section class="section" aria-labelledby="extract-title">
      <div class="section-head"><div><h2 id="extract-title">拆分已有 APNG</h2><p>提取静态封面和各个不同的动画画面，分别保存为 PNG。</p></div><button class="secondary" id="pick-apng" type="button">选择 APNG 文件</button></div>
      <div class="extract-drop" id="extract-drop" role="button" tabindex="0" aria-label="选择要拆分的 APNG"><div><strong>选择或拖入 APNG 文件</strong><span>图片仅在本地浏览器中处理</span></div></div>
      <div class="status" id="extract-status" role="status" aria-live="polite"></div>
      <div class="frames" id="frames"></div>
    </section>
    <input id="cover-input" type="file" accept="image/*">
    <input id="reveal-input" type="file" accept="image/*">
    <input id="apng-input" type="file" accept=".png,image/png">
  </main>
  <script>
    const state = { cover: null, reveal: null, fit: 'contain', background: '#ffffff', busy: false, extracting: false, result: null, extractedUrls: [] };
    const $ = id => document.getElementById(id);
    const encoder = new TextEncoder();
    const signature = Uint8Array.of(137, 80, 78, 71, 13, 10, 26, 10);
    const crcTable = Uint32Array.from({ length: 256 }, (_, n) => {
      let c = n;
      for (let i = 0; i < 8; i++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      return c >>> 0;
    });

    function setStatus(message, error = false) {
      $('status').textContent = message;
      $('status').classList.toggle('error', error);
    }

    function setExtractStatus(message, error = false) {
      $('extract-status').textContent = message;
      $('extract-status').classList.toggle('error', error);
    }

    function download(url, name) {
      const link = document.createElement('a');
      link.href = url;
      link.download = name;
      document.body.append(link);
      link.click();
      link.remove();
    }

    function updateUI() {
      const cover = state.cover;
      $('generate').disabled = !cover || !state.reveal || state.busy;
      $('output-size').textContent = cover ? `${cover.width} × ${cover.height} 像素` : '等待选择图片';
      $('reveal-drop').style.backgroundColor = state.reveal && state.fit === 'contain' ? state.background : '';
      $('background').disabled = state.fit !== 'contain';
      renderRevealPreview();
    }

    function drawFitted(context, image, width, height, fit) {
      const scale = fit === 'cover' ? Math.max(width / image.width, height / image.height) : Math.min(width / image.width, height / image.height);
      const drawWidth = image.width * scale;
      const drawHeight = image.height * scale;
      context.drawImage(image.bitmap, (width - drawWidth) / 2, (height - drawHeight) / 2, drawWidth, drawHeight);
    }

    function renderRevealPreview() {
      const preview = $('reveal-drop').querySelector('img');
      if (!preview || !state.reveal) return;
      if (!state.cover) { preview.src = state.reveal.url; return; }
      const scale = Math.min(500 / state.cover.width, 500 / state.cover.height, 1);
      const width = Math.max(1, Math.round(state.cover.width * scale));
      const height = Math.max(1, Math.round(state.cover.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      if (state.fit === 'contain') {
        context.fillStyle = state.background;
        context.fillRect(0, 0, width, height);
      }
      drawFitted(context, state.reveal, width, height, state.fit);
      preview.src = canvas.toDataURL('image/png');
      preview.style.objectFit = 'contain';
    }

    async function choose(file, kind) {
      if (!file) return;
      if (!file.type.startsWith('image/')) return setStatus('请选择图片文件。', true);
      let bitmap;
      try { bitmap = await createImageBitmap(file); }
      catch { return setStatus('无法读取这张图片，请换用 PNG、JPG 或 WebP。', true); }
      const url = URL.createObjectURL(file);
      const previous = state[kind];
      state[kind] = { file, bitmap, url, width: bitmap.width, height: bitmap.height };
      const drop = $(kind + '-drop');
      const image = document.createElement('img');
      image.alt = kind === 'cover' ? '静态封面预览' : '打开后画面预览';
      image.src = url;
      image.style.objectFit = kind === 'reveal' ? state.fit : 'contain';
      drop.replaceChildren(image);
      $(kind + '-name').textContent = file.name;
      $(kind + '-size').textContent = `${bitmap.width} × ${bitmap.height}`;
      if (previous) { previous.bitmap.close(); URL.revokeObjectURL(previous.url); }
      setStatus('');
      updateUI();
    }

    function u32(n) {
      const bytes = new Uint8Array(4);
      new DataView(bytes.buffer).setUint32(0, n);
      return bytes;
    }

    function chunk(type, payload = new Uint8Array()) {
      const name = encoder.encode(type);
      const result = new Uint8Array(payload.length + 12);
      result.set(u32(payload.length), 0);
      result.set(name, 4);
      result.set(payload, 8);
      let crc = 0xffffffff;
      for (let i = 4; i < result.length - 4; i++) crc = crcTable[(crc ^ result[i]) & 255] ^ (crc >>> 8);
      result.set(u32((crc ^ 0xffffffff) >>> 0), result.length - 4);
      return result;
    }

    function frameControl(sequence, width, height, blend) {
      const data = new Uint8Array(26);
      const view = new DataView(data.buffer);
      view.setUint32(0, sequence);
      view.setUint32(4, width);
      view.setUint32(8, height);
      view.setUint16(20, 10);
      view.setUint16(22, 100);
      data[24] = 0;
      data[25] = blend;
      return data;
    }

    async function compress(pixels, width, height) {
      const stride = width * 4;
      const raw = new Uint8Array(height * (stride + 1));
      for (let y = 0; y < height; y++) raw.set(pixels.subarray(y * stride, (y + 1) * stride), y * (stride + 1) + 1);
      const stream = new CompressionStream('deflate');
      const result = new Response(stream.readable).arrayBuffer();
      const writer = stream.writable.getWriter();
      await writer.write(raw);
      await writer.close();
      return new Uint8Array(await result);
    }

    async function encodeImage(image, width, height, fit, background) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      if (background) { context.fillStyle = background; context.fillRect(0, 0, width, height); }
      drawFitted(context, image, width, height, fit);
      const pixels = context.getImageData(0, 0, width, height).data;
      return compress(pixels, width, height);
    }

    async function generate() {
      if (!state.cover || !state.reveal || state.busy) return;
      if (typeof CompressionStream === 'undefined') return setStatus('当前浏览器不支持生成，请使用新版 Chrome 或 Edge。', true);
      const { width, height } = state.cover;
      if (width * height > 16000000) return setStatus('封面超过 1600 万像素，请先缩小图片。', true);
      state.busy = true;
      updateUI();
      setStatus('正在处理静态封面…');
      let url, coverUrl;
      try {
        const coverData = await encodeImage(state.cover, width, height, 'contain', null);
        setStatus('正在处理打开后画面…');
        const revealData = await encodeImage(state.reveal, width, height, state.fit, state.fit === 'contain' ? state.background : null);
        const holdData = await compress(Uint8Array.of(0, 0, 0, 0), 1, 1);
        const ihdr = new Uint8Array(13);
        const view = new DataView(ihdr.buffer);
        view.setUint32(0, width);
        view.setUint32(4, height);
        ihdr[8] = 8;
        ihdr[9] = 6;
        const animation = new Uint8Array(8);
        new DataView(animation.buffer).setUint32(0, 2);
        const text = encoder.encode('ChatBarApngDisguise\0' + '1;STATIC;1');
        const frameData = (sequence, data) => {
          const payload = new Uint8Array(data.length + 4);
          payload.set(u32(sequence));
          payload.set(data, 4);
          return chunk('fdAT', payload);
        };
        const blob = new Blob([
          signature, chunk('IHDR', ihdr), chunk('acTL', animation), chunk('tEXt', text),
          chunk('IDAT', coverData),
          chunk('fcTL', frameControl(0, width, height, 0)), frameData(1, revealData),
          chunk('fcTL', frameControl(2, 1, 1, 1)), frameData(3, holdData), chunk('IEND')
        ], { type: 'image/png' });
        url = URL.createObjectURL(blob);
        const name = state.cover.file.name.replace(/\.[^.]+$/, '') + '-双面.png';
        const parsed = readPng(new Uint8Array(await blob.arrayBuffer()));
        coverUrl = URL.createObjectURL(stillPng(parsed, width, height, parsed.coverData));
        if (state.result) state.result.urls.forEach(oldUrl => URL.revokeObjectURL(oldUrl));
        state.result = { url, name, urls: [url, coverUrl] };
        $('result-cover').src = coverUrl;
        $('result').hidden = false;
        $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        setStatus(`已生成 ${name} · ${(blob.size / 1048576).toFixed(2)} MB`);
      } catch (error) {
        if (url) URL.revokeObjectURL(url);
        if (coverUrl) URL.revokeObjectURL(coverUrl);
        console.error(error);
        setStatus('生成失败。请检查图片文件，或尝试缩小封面后重试。', true);
      } finally {
        state.busy = false;
        updateUI();
      }
    }

    function readPng(bytes) {
      if (!signature.every((value, index) => bytes[index] === value)) throw new Error('这不是 PNG 文件。');
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const shared = [];
      const coverData = [];
      const frames = [];
      let header, current, animated = false, seenImage = false;
      for (let offset = 8; offset + 12 <= bytes.length;) {
        const length = view.getUint32(offset);
        if (length > bytes.length - offset - 12) throw new Error('PNG 文件不完整。');
        const type = String.fromCharCode(...bytes.subarray(offset + 4, offset + 8));
        const data = bytes.subarray(offset + 8, offset + 8 + length);
        offset += length + 12;
        if (type === 'IHDR') header = data.slice();
        else if (type === 'acTL') animated = true;
        else if (type === 'fcTL') {
          if (length !== 26) throw new Error('APNG 帧信息无效。');
          if (current) frames.push(current);
          current = { width: new DataView(data.buffer, data.byteOffset).getUint32(4), height: new DataView(data.buffer, data.byteOffset).getUint32(8), x: new DataView(data.buffer, data.byteOffset).getUint32(12), y: new DataView(data.buffer, data.byteOffset).getUint32(16), dispose: data[24], blend: data[25], data: [] };
        } else if (type === 'IDAT') {
          seenImage = true;
          coverData.push(data);
          if (current) current.data.push(data);
        } else if (type === 'fdAT') {
          if (!current || length < 4) throw new Error('APNG 帧数据无效。');
          current.data.push(data.subarray(4));
        } else if (!seenImage && ['PLTE', 'tRNS', 'gAMA', 'cHRM', 'sRGB', 'iCCP', 'sBIT'].includes(type)) shared.push(chunk(type, data));
        if (type === 'IEND') break;
      }
      if (current) frames.push(current);
      if (!header || !coverData.length || !animated || !frames.length) throw new Error('文件中没有可拆分的 APNG 动画。');
      const size = new DataView(header.buffer);
      const width = size.getUint32(0), height = size.getUint32(4);
      if (!width || !height || width * height > 16000000 || frames.length > 120) throw new Error('图片尺寸或帧数超出支持范围。');
      for (const frame of frames) {
        if (!frame.width || !frame.height || frame.x + frame.width > width || frame.y + frame.height > height || !frame.data.length || frame.dispose > 2 || frame.blend > 1) throw new Error('APNG 帧范围或参数无效。');
      }
      return { header, shared, coverData, frames, width, height };
    }

    function stillPng(parsed, width, height, data) {
      const header = parsed.header.slice();
      const view = new DataView(header.buffer);
      view.setUint32(0, width);
      view.setUint32(4, height);
      return new Blob([signature, chunk('IHDR', header), ...parsed.shared, ...data.map(part => chunk('IDAT', part)), chunk('IEND')], { type: 'image/png' });
    }

    function canvasPng(canvas) {
      return new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('浏览器无法导出 PNG。')), 'image/png'));
    }

    async function splitApng(file) {
      const parsed = readPng(new Uint8Array(await file.arrayBuffer()));
      const cover = { url: URL.createObjectURL(stillPng(parsed, parsed.width, parsed.height, parsed.coverData)) };
      const canvas = document.createElement('canvas');
      canvas.width = parsed.width;
      canvas.height = parsed.height;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      const frames = [];
      let previousPixels = null;
      try {
        for (let index = 0; index < parsed.frames.length; index++) {
          const frame = parsed.frames[index];
          const previous = frame.dispose === 2 ? context.getImageData(frame.x, frame.y, frame.width, frame.height) : null;
          const bitmap = await createImageBitmap(stillPng(parsed, frame.width, frame.height, frame.data));
          if (frame.blend === 0) context.clearRect(frame.x, frame.y, frame.width, frame.height);
          context.drawImage(bitmap, frame.x, frame.y);
          bitmap.close();
          const pixels = context.getImageData(0, 0, parsed.width, parsed.height).data;
          if (!previousPixels || !pixels.every((value, position) => value === previousPixels[position])) {
            frames.push({ index: index + 1, url: URL.createObjectURL(await canvasPng(canvas)) });
            previousPixels = pixels;
          }
          if (frame.dispose === 1) context.clearRect(frame.x, frame.y, frame.width, frame.height);
          if (previous) context.putImageData(previous, frame.x, frame.y);
        }
        return { cover, frames, width: parsed.width, height: parsed.height };
      } catch (error) {
        URL.revokeObjectURL(cover.url);
        frames.forEach(frame => URL.revokeObjectURL(frame.url));
        throw error;
      }
    }

    async function extract(file) {
      if (!file || state.extracting) return;
      state.extracting = true;
      $('pick-apng').disabled = true;
      $('frames').replaceChildren();
      state.extractedUrls.forEach(url => URL.revokeObjectURL(url));
      state.extractedUrls = [];
      setExtractStatus('正在拆分 APNG…');
      try {
        const result = await splitApng(file);
        const stem = file.name.replace(/\.[^.]+$/, '');
        const items = [{ title: '静态封面', suffix: '封面', url: result.cover.url }, ...result.frames.map(frame => ({ title: `动画画面 ${frame.index}`, suffix: `画面-${frame.index}`, url: frame.url }))];
        state.extractedUrls = items.map(item => item.url);
        for (const item of items) {
          const card = document.createElement('article');
          card.className = 'frame';
          const image = document.createElement('img');
          image.src = item.url;
          image.alt = item.title;
          const title = document.createElement('div');
          title.className = 'frame-title';
          const strong = document.createElement('strong');
          strong.textContent = item.title;
          const size = document.createElement('span');
          size.textContent = `${result.width} × ${result.height}`;
          title.append(strong, size);
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'secondary';
          button.textContent = '下载 PNG';
          button.addEventListener('click', () => download(item.url, `${stem}-${item.suffix}.png`));
          card.append(image, title, button);
          $('frames').append(card);
        }
        setExtractStatus(`已拆分 ${file.name}：静态封面 + ${result.frames.length} 个不同的动画画面。`);
      } catch (error) {
        setExtractStatus(error.message || '拆分失败，请检查 APNG 文件。', true);
      } finally {
        state.extracting = false;
        $('pick-apng').disabled = false;
      }
    }

    for (const kind of ['cover', 'reveal']) {
      const input = $(kind + '-input');
      const drop = $(kind + '-drop');
      document.querySelector(`[data-pick="${kind}"]`).addEventListener('click', () => input.click());
      input.addEventListener('change', () => { choose(input.files[0], kind); input.value = ''; });
      drop.addEventListener('click', () => input.click());
      drop.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); input.click(); } });
      drop.addEventListener('dragover', event => { event.preventDefault(); drop.classList.add('dragging'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
      drop.addEventListener('drop', event => { event.preventDefault(); drop.classList.remove('dragging'); choose(event.dataTransfer.files[0], kind); });
    }
    document.querySelectorAll('[data-fit]').forEach(button => button.addEventListener('click', () => {
      state.fit = button.dataset.fit;
      document.querySelectorAll('[data-fit]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      updateUI();
    }));
    $('background').addEventListener('input', event => {
      state.background = event.target.value;
      $('color-value').textContent = state.background.toUpperCase();
      updateUI();
    });
    $('generate').addEventListener('click', generate);
    $('download-result').addEventListener('click', () => { if (state.result) download(state.result.url, state.result.name); });
    $('pick-apng').addEventListener('click', () => $('apng-input').click());
    $('apng-input').addEventListener('change', event => { extract(event.target.files[0]); event.target.value = ''; });
    $('extract-drop').addEventListener('click', () => $('apng-input').click());
    $('extract-drop').addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); $('apng-input').click(); } });
    $('extract-drop').addEventListener('dragover', event => { event.preventDefault(); $('extract-drop').classList.add('dragging'); });
    $('extract-drop').addEventListener('dragleave', () => $('extract-drop').classList.remove('dragging'));
    $('extract-drop').addEventListener('drop', event => { event.preventDefault(); $('extract-drop').classList.remove('dragging'); extract(event.dataTransfer.files[0]); });
  </script>
</body>
</html>
